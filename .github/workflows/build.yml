name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: headless tests
        run: game\build.bat test
      - name: game (release)
        run: game\build.bat
      - name: headless simulation smoke run
        run: .\mare.exe --simulate=60 --seed=1 --nation=4 --log-level=info
      - uses: actions/upload-artifact@v4
        with: { name: mare-windows, path: mare.exe }
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc libx11-dev libgl1-mesa-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libasound2-dev
      - run: ./game/build.sh test 2
      - run: ./game/build.sh -O2 -Wall
      - run: ./mare --simulate=60 --seed=1 --nation=4 --log-level=info
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./game/build.sh test 2
      - run: ./game/build.sh
